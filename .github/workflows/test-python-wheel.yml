name: Test one platform wheel

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA under test.
        required: true
        type: string
      runner:
        description: GitHub runner image.
        required: true
        type: string
      python_versions:
        description: JSON array of Python versions.
        required: true
        type: string
      wheel_artifact:
        description: Exact wheel artifact produced in this workflow run.
        required: true
        type: string
      test_mode:
        description: full or compatibility.
        required: true
        type: string
      restore_lfs:
        description: Restore the shared TIFF fixture bundle.
        required: false
        default: false
        type: boolean
      physical_windows_gpu:
        description: Run the full Windows matrix on the required NVIDIA Vulkan runner.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ inputs.test_mode }} (${{ inputs.physical_windows_gpu && 'Windows NVIDIA Vulkan' || inputs.runner }}, ${{ matrix.python-version }})
    runs-on: ${{ inputs.physical_windows_gpu && fromJSON('["self-hosted", "Windows", "X64", "forge3d-gpu", "gpu-nvidia"]') || inputs.runner }}
    # Physical full runs include the 600-frame TESSELLA test (34m23s measured).
    # Reuse TESSELLA's 90-minute physical allowance; hosted runs retain 35 minutes.
    timeout-minutes: ${{ inputs.physical_windows_gpu && 90 || 35 }}
    env:
      # Self-hosted runners must use declared dependencies, not user packages.
      PYTHONNOUSERSITE: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prove exact-head checkout
        shell: python
        env:
          EXPECTED_HEAD: ${{ inputs.ref }}
        run: |
          import os
          import subprocess
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["EXPECTED_HEAD"]
          if actual != expected:
              raise SystemExit(f"Checkout mismatch: expected {expected}, got {actual}")

      - name: Configure physical Windows acceptance
        if: inputs.physical_windows_gpu
        shell: pwsh
        run: |
          if ('${{ inputs.test_mode }}' -ne 'full' -or '${{ runner.os }}' -ne 'Windows') {
            throw 'Physical Windows acceptance requires the full Windows test profile'
          }
          $evidence = Join-Path $env:RUNNER_TEMP 'forge3d-python-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          @(
            'FORGE3D_NO_BOOTSTRAP=1'
            'FORGE3D_TEST_INSTALLED_WHEEL=1'
            'FORGE3D_ALLOW_HOSTED_WINDOWS_TERRAIN=1'
            'WGPU_BACKEND=vulkan'
            'WGPU_BACKENDS=vulkan'
            'FORGE3D_DETERMINISM_TEST_BACKEND=vulkan'
            "FORGE3D_EXPECTED_ADAPTER_PROBE=$(Join-Path $evidence 'adapter.json')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download shared LFS fixture artifact
        if: inputs.restore_lfs
        uses: actions/download-artifact@v4
        with:
          name: lfs-fixture-bundles
          path: lfs-fixture-bundles

      - name: Restore Python TIFF fixtures
        if: inputs.restore_lfs
        run: python -m zipfile -e lfs-fixture-bundles/python-tiffs.zip .

      - name: Download exact platform wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wheel_artifact }}
          path: dist/

      - name: Install wheel and compatibility dependencies
        if: inputs.test_mode == 'compatibility'
        shell: python
        run: |
          import subprocess
          import sys
          subprocess.check_call([sys.executable, "scripts/install_compatible_wheel.py", "dist"])
          subprocess.check_call([sys.executable, "-m", "pip", "install", "pytest", "numpy"])

      - name: Install wheel and full-suite dependencies
        if: inputs.test_mode == 'full'
        shell: python
        run: |
          import subprocess
          import sys
          subprocess.check_call([sys.executable, "scripts/install_compatible_wheel.py", "dist"])
          subprocess.check_call([sys.executable, "-m", "pip", "install", "pytest", "pyyaml", "numpy", "pillow", "mypy", "pyproj", "rasterio"])

      - name: Install system fonts
        if: inputs.test_mode == 'full' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Vulkan runtime for native constructor tests
        if: inputs.test_mode == 'full' && runner.os == 'Linux'
        run: sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Require physical NVIDIA Vulkan terrain adapter
        if: inputs.physical_windows_gpu
        shell: pwsh
        run: |
          python scripts/terrain_ci_probe.py --mode terrain --require-nvidia-vulkan --json "$env:FORGE3D_EXPECTED_ADAPTER_PROBE"
          exit $LASTEXITCODE

      - name: Retain physical Windows adapter evidence
        if: always() && inputs.physical_windows_gpu
        uses: actions/upload-artifact@v4
        with:
          name: python-full-Windows-adapter-${{ matrix.python-version }}
          path: ${{ env.FORGE3D_EXPECTED_ADAPTER_PROBE }}
          if-no-files-found: error
          retention-days: 1

      - name: Run compatibility smoke
        if: inputs.test_mode == 'compatibility'
        env:
          FORGE3D_NO_BOOTSTRAP: '1'
        run: >-
          python -m pytest
          tests/test_install_smoke.py
          tests/test_license.py
          tests/test_api_contracts.py
          -v --tb=short

      - name: Record D02 physical-test deselection
        if: inputs.test_mode == 'full' && runner.os != 'macOS'
        run: >-
          python -c "import os; from pathlib import Path; reason = 'D02: Linux/Windows Python matrices deselect tests/test_raster_styles_gpu.py (three physical cases); required NVIDIA Vulkan acceptance runs all three with zero skips and unchanged physical/pixel assertions.'; print('::notice::' + reason); Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8').write(reason + '\n')"

      - name: Run full default Python lane
        if: inputs.test_mode == 'full'
        env:
          FORGE3D_NO_BOOTSTRAP: '1'
        run: |
          python scripts/ci_pytest_lane.py --profile full -v --tb=short --durations=30 -rs --junitxml=python-full-junit.xml ${{ runner.os != 'macOS' && '--deselect=tests/test_raster_styles_gpu.py' || '' }}

      - name: Record full Python timings and explicit skips
        if: always() && inputs.test_mode == 'full'
        run: python scripts/summarize_python_lane.py python-full-junit.xml

      - name: Upload full Python timing and skip evidence
        if: always() && inputs.test_mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: python-full-${{ runner.os }}-${{ matrix.python-version }}
          path: python-full-junit.xml
          if-no-files-found: warn
          retention-days: 1
