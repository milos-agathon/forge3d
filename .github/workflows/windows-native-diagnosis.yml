name: Windows native failure diagnosis

on:
  workflow_dispatch:
  push:
    branches: [codex/main-acceptance-repair]
    paths:
      - .github/workflows/windows-native-diagnosis.yml
      - scripts/windows_native_diagnosis.py

permissions:
  contents: read

jobs:
  build-wheel:
    uses: ./.github/workflows/build-wheel.yml
    with:
      ref: ${{ github.sha }}
      runner: windows-latest
      target: x86_64-pc-windows-msvc
      maturin_args: --release --out dist
      manylinux: auto
      artifact: windows-diagnosis-wheel

  diagnose:
    needs: build-wheel
    runs-on: windows-latest
    # Match the existing full Python wheel lane's execution limit.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prove exact-head checkout
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_HEAD) {
            throw 'Diagnostic checkout does not match the requested revision'
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/download-artifact@v4
        with:
          name: windows-diagnosis-wheel
          path: dist/

      - name: Install exact-head wheel and full-lane dependencies
        run: |
          python scripts/install_compatible_wheel.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest pyyaml numpy pillow mypy pyproj rasterio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Observe existing Windows failures
        shell: pwsh
        env:
          FORGE3D_NO_BOOTSTRAP: '1'
          FORGE3D_TEST_INSTALLED_WHEEL: '1'
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python scripts/windows_native_diagnosis.py --expected-head $env:EXPECTED_HEAD --output windows-native-diagnosis 2>&1 | Tee-Object -FilePath windows-native-diagnosis.log
          exit $LASTEXITCODE

      - name: Retain results even when the original tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-diagnosis
          path: |
            windows-native-diagnosis/
            windows-native-diagnosis.log
          if-no-files-found: error
