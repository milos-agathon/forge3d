name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: egm96-windows-pre-selene-baseline
  cancel-in-progress: false

jobs:
  egm96-windows-baseline:
    name: EGM96 Windows pre-SELENE baseline
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build exact-branch release wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: x86_64-pc-windows-msvc
          args: --release --locked --out dist
          manylinux: auto

      - name: Install release wheel and pytest
        shell: pwsh
        run: |
          python scripts/install_compatible_wheel.py dist
          python -m pip install pytest numpy

      - name: Prove exact pre-SELENE Windows payload
        shell: pwsh
        env:
          FORGE3D_NO_BOOTSTRAP: '1'
          FORGE3D_TEST_INSTALLED_WHEEL: '1'
        run: |
          $wheel = Get-ChildItem dist/*.whl
          if ($wheel.Count -ne 1) { throw "Expected exactly one release wheel" }
          Get-FileHash $wheel.FullName -Algorithm SHA256 |
            Format-List | Out-File -Encoding utf8 egm96-windows-baseline.txt
          python -m pytest `
            tests/test_install_smoke.py::test_pre_selene_egm96_windows_release_byte_lock `
            -v -s --tb=short 2>&1 | Tee-Object -Append egm96-windows-baseline.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload SHA-bound baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egm96-windows-baseline
          path: egm96-windows-baseline.txt
          if-no-files-found: error
          retention-days: 90
