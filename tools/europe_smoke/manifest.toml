attribution_required = true

# ---------------------------------------------------------------------------
# Pinning policy.
#
# A hash that writes itself is not a control: a corrupted or substituted
# artifact would pin its own corruption and every later run would agree with
# it. So no automated step -- not `probe --check`, not `fetch.run()` -- ever
# mutates this file.
#
# The operator flow, once, per artifact:
#   1. `probe --check` prints  [warn] natural_earth: unpinned; sha256=<hex>
#      and writes the same value to {build}/proposed_pins.toml (outside the
#      tracked tree, so it can never be mistaken for the manifest).
#   2. The operator confirms the artifact's PROVENANCE by hand -- the upstream
#      URL above, the publisher's own checksum where one exists, the download
#      log -- not merely that the file is on disk.
#   3. `probe --write-pins` copies the observed hashes in. It refuses to run at
#      all while anything is blocking, and it refuses to touch an entry whose
#      sha256 is already non-empty, so a pin can never be silently rotated and
#      a substituted artifact can never be pinned around; changing a pin is a
#      deliberate hand edit.
#   4. The change lands as a diff in a TRACKED file and is reviewed in git
#      like any other. That review, not the code, is the control.
#
# `probe --check --strict` fails while anything is still unpinned, so an
# unpinned artifact cannot ride along unnoticed to release.
