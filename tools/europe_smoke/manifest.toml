# tools/europe_smoke/manifest.toml
# §10.2 external-artifact contract. Every input a clean checkout cannot carry.
#
# Each entry declares a CLASS, which decides what a problem with it means:
#
#   class = "required"  the build cannot start without it. Absent -> BLOCKING.
#   class = "acquired"  the build itself creates it. Absent before the acquiring
#                       step -> "pending" (a warning, never blocking). Present
#                       -> verified exactly like a required artifact.
#   class = "remote"    a live API with no local file. Never hashed; gated by
#                       its credential entry instead (see check_credentials).
#
# A hash MISMATCH or a size MISMATCH is BLOCKING for every class that has a
# path. §10.2: "fails loudly on mismatch rather than proceeding with a
# substituted artifact."
#
# An entry with an EMPTY sha256 is "unpinned": a distinct, visible third state.
# It is reported with its observed hash, counted as a warning, recorded in the
# build report, and it fails `probe --check --strict`. It never silently passes.
# Nothing in the automated build writes a hash back into this file; see
# `probe --write-pins` and the note at the bottom.
#
# Paths may use {repo}, {build} and {cache} placeholders, resolved against
# config.REPO_ROOT / config.BUILD_DIR / config.CACHE_DIR. A bare relative path
# is repo-relative; an absolute path is used as written.
#
# MERGE NOTE: the natural_earth path uses {build}/cache/... not {cache}/...
# (do not write the table header inside a comment: apply_pins locates an entry
# with a plain str.partition and would find the comment first).
# The two are the same directory (config.CACHE_DIR == config.BUILD_DIR/"cache"),
# but only {build} is resolved from a live module attribute that a test can
# monkeypatch -- CACHE_DIR is bound at import time, so redirecting BUILD_DIR
# alone would leave a {cache} path pointing at the real drive. Both fixes'
# tests are satisfied by this spelling.

